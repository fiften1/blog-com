<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Личный кабинет</title>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
  <script>
    document.documentElement.classList.add('js');
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <!-- Цвета, кнопки и поля — общие с сайтом -->
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="account.css">
</head>
<body>
  <div class="blobs" aria-hidden="true">
    <div class="blobs__layer"><span class="blob blob--violet"></span></div>
    <div class="blobs__layer"><span class="blob blob--cyan"></span></div>
    <div class="blobs__layer"><span class="blob blob--pink"></span></div>
  </div>

  <header class="acc-top">
    <a class="acc-top__back" href="../">
      <svg viewBox="0 0 64 64" width="22" height="22" aria-hidden="true"><path d="M32 8 52 20v24L32 56 12 44V20z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><circle cx="32" cy="32" r="6" fill="#a855f7"/></svg>
      <span id="siteName">На сайт</span>
    </a>
    <button class="icon-btn" id="themeToggle" type="button" aria-label="Переключить тему">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="acc" id="acc">
    <div class="acc-state">Загружаю…</div>
  </main>

  <div class="acc-toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
