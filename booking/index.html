<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ваша запись</title>
  <link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
  <!-- Страница для клиента: перенести или отменить запись по ссылке из письма -->
  <script>
    try {
      var saved = localStorage.getItem('theme');
      var t = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --violet: #a855f7; --cyan: #22d3ee; --pink: #ec4899; --accent: var(--violet);
      --bg: #0a0a12; --surface: rgba(255,255,255,.03); --line: rgba(255,255,255,.09); --line-strong: rgba(255,255,255,.18);
      --text: #d9d9e3; --muted: #8a8a9c; --faint: #5c5c6e; --heading: #f5f5f8; --danger: #f43f5e;
      --btn-bg: #f5f5f8; --btn-text: #0a0a12;
    }
    :root[data-theme="light"] {
      --violet: #7c3aed; --cyan: #0e7490; --pink: #be185d;
      --bg: #f7f7f5; --surface: rgba(0,0,0,.02); --line: rgba(0,0,0,.09); --line-strong: rgba(0,0,0,.2);
      --text: #2a2a33; --muted: #6b6b78; --faint: #9a9aa6; --heading: #0f0f14; --danger: #e11d48;
      --btn-bg: #0f0f14; --btn-text: #f7f7f5;
    }
    * { box-sizing: border-box; }
    :root[data-theme="light"] body {
      background: radial-gradient(120% 80% at 0% 0%, #e9ddff 0%, transparent 55%), radial-gradient(90% 70% at 100% 30%, #d6f1fb 0%, transparent 60%),
        radial-gradient(100% 80% at 30% 100%, #ffe1ec 0%, transparent 60%), linear-gradient(160deg, #f5f0ff 0%, #eef6fd 50%, #fdf3f6 100%) fixed;
    }
    :root[data-theme="light"] .card { background: rgba(255,255,255,.55); box-shadow: 0 10px 30px rgba(76,58,140,.08); }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 400 16px/1.6 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      display: grid; place-items: center; padding: 32px 16px; }
    .glow { position: fixed; z-index: -1; width: 60vmax; height: 60vmax; left: -25vmax; top: -35vmax; border-radius: 50%;
      background: radial-gradient(circle, var(--violet), transparent 65%); opacity: .14; filter: blur(80px); }
    main { width: min(480px, 100%); }
    .back { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); text-decoration: none; font-size: 14px; margin-bottom: 20px; }
    .back:hover { color: var(--heading); }
    .card { border: 1px solid var(--line); border-radius: 18px; background: var(--surface); padding: 28px 24px; backdrop-filter: blur(12px); }
    h1 { font: 500 28px/1.15 'Space Grotesk', sans-serif; letter-spacing: -.03em; color: var(--heading); margin: 0 0 6px; }
    .sub { color: var(--muted); margin: 0 0 22px; font-size: 15px; }
    .when { font: 500 22px/1.3 'Space Grotesk', sans-serif; color: var(--heading); letter-spacing: -.02em; }
    .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .status { display: inline-block; margin-top: 12px; font: 12px ui-monospace, Menlo, monospace; padding: 3px 10px; border-radius: 99px; border: 1px solid currentColor; }
    .status--ok { color: #22c55e; } .status--new { color: var(--cyan); }
    .actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
    .btn { flex: 1 1 160px; padding: 13px 18px; border-radius: 999px; font: 500 15px 'Inter', sans-serif; cursor: pointer; border: 1px solid var(--line-strong); background: transparent; color: var(--heading); transition: box-shadow .25s, border-color .25s, opacity .2s; }
    .btn:hover { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(168,85,247,.3), 0 0 22px rgba(168,85,247,.15); }
    .btn--primary { background: var(--btn-bg); color: var(--btn-text); border-color: transparent; }
    .btn--danger { color: var(--danger); }
    .btn--danger:hover { border-color: var(--danger); box-shadow: none; }
    .btn[disabled] { opacity: .5; pointer-events: none; }
    .move { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--line); display: none; }
    .move.is-open { display: block; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    input, select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--heading); font: inherit; font-size: 15px; -webkit-appearance: none; appearance: none; }
    input:focus, select:focus { outline: 0; border-color: var(--accent); }
    input[type="date"] { color-scheme: dark; } :root[data-theme="light"] input[type="date"] { color-scheme: light; }
    .msg { margin: 14px 0 0; font-size: 14px; min-height: 1.4em; color: var(--muted); }
    .msg.is-error { color: var(--pink); } .msg.is-ok { color: var(--cyan); }
    .center { text-align: center; }
    .icon { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--accent); margin: 0 auto 16px; font-size: 22px; }
    a.link { color: var(--accent); }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main>
    <a class="back" href="../">← На сайт</a>
    <div class="card" id="card"><p class="sub">Загружаю запись…</p></div>
  </main>

  <script>
  (() => {
    const $ = (s) => document.querySelector(s);
    const esc = (s = '') => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    const WD = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
    const human = (iso) => { const [y, m, d] = iso.split('-').map(Number); return `${d} ${MONTHS[m - 1]}, ${WD[new Date(Date.UTC(y, m - 1, d)).getUTCDay()]}`; };
    const pad = (n) => String(n).padStart(2, '0');
    const isoLocal = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

    const q = new URLSearchParams(location.search);
    let id = q.get('id'), t = q.get('t');
    const card = $('#card');
    let slots = ['10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00'];

    async function call(method, data) {
      const r = method === 'GET'
        ? await fetch(`/api/manage?id=${encodeURIComponent(id)}&t=${encodeURIComponent(t)}`, { cache: 'no-store' })
        : await fetch('/api/manage', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, t, ...data }) });
      const out = await r.json().catch(() => ({}));
      if (!r.ok || !out.ok) throw Object.assign(new Error(out.error || 'Ошибка сети. Попробуйте ещё раз.'), out);
      return out;
    }

    const done = (icon, title, text) => {
      card.innerHTML = `<div class="center"><div class="icon">${icon}</div><h1>${title}</h1><p class="sub" style="margin:0 0 20px">${text}</p>
        <a class="btn btn--primary" style="display:inline-block;text-decoration:none" href="../#booking">Вернуться на сайт</a></div>`;
    };

    function render(b) {
      card.innerHTML = `
        <h1>Ваша запись</h1>
        <p class="sub">${b.name ? esc(b.name) + ', здесь' : 'Здесь'} можно перенести или отменить запись.</p>
        <div class="when">${esc(human(b.date))}, ${esc(b.time)}</div>
        ${b.service ? `<div class="meta">${esc(b.service)}</div>` : ''}
        <span class="status ${b.status === 'confirmed' ? 'status--ok' : 'status--new'}">${b.status === 'confirmed' ? 'подтверждено' : 'ожидает подтверждения'}</span>
        ${b.past ? '<p class="msg">Эта запись уже прошла.</p>' : `
        <div class="actions">
          <button class="btn btn--primary" id="moveBtn">Перенести</button>
          <button class="btn btn--danger" id="cancelBtn">Отменить запись</button>
        </div>
        <div class="move" id="move">
          <div class="row">
            <div><label for="d">Новая дата</label><input type="date" id="d"></div>
            <div><label for="tm">Время</label><select id="tm"><option value="">Сначала дата</option></select></div>
          </div>
          <div class="actions"><button class="btn btn--primary" id="saveMove" disabled>Перенести на это время</button></div>
        </div>`}
        <p class="msg" id="msg"></p>`;
      if (b.past) return;

      const msg = $('#msg');
      const say = (text, cls = '') => { msg.textContent = text; msg.className = `msg ${cls}`; };
      const d = $('#d'), tm = $('#tm'), save = $('#saveMove');
      const today = new Date(), max = new Date(); max.setDate(max.getDate() + 60);
      d.min = isoLocal(today); d.max = isoLocal(max);

      $('#moveBtn').addEventListener('click', () => { $('#move').classList.toggle('is-open'); d.focus(); });

      d.addEventListener('change', async () => {
        tm.innerHTML = '<option value="">Загружаю…</option>'; save.disabled = true;
        let taken = [], closed = null;
        try { const r = await (await fetch(`/api/slots?date=${d.value}`, { cache: 'no-store' })).json(); taken = r.taken || []; closed = r.closed; } catch (e) {}
        const now = new Date(); const nowMin = now.getHours() * 60 + now.getMinutes() + 30;
        const isToday = d.value === isoLocal(now);
        const free = closed ? [] : slots.filter((s) => { const [h, m] = s.split(':').map(Number); return !taken.includes(s) && !(isToday && h * 60 + m < nowMin) && !(d.value === b.date && s === b.time); });
        tm.innerHTML = free.length
          ? '<option value="">Выбрать</option>' + free.map((s) => `<option>${s}</option>`).join('')
          : `<option value="">${closed ? esc(closed) + ' — записи нет' : 'Свободного времени нет'}</option>`;
      });
      tm.addEventListener('change', () => { save.disabled = !tm.value; });

      save.addEventListener('click', async () => {
        save.disabled = true; say('Переношу…');
        try {
          const out = await call('POST', { action: 'move', date: d.value, time: tm.value });
          // у перенесённой записи новая ссылка
          const u = new URL(out.manageUrl); id = u.searchParams.get('id'); t = u.searchParams.get('t');
          history.replaceState(null, '', `?id=${id}&t=${t}`);
          render(out.booking);
          // render() перерисовал карточку — пишем в новый элемент сообщения
          const m = $('#msg');
          if (m) { m.textContent = `Готово! Новое время: ${human(out.booking.date)}, ${out.booking.time}. Письмо с подтверждением отправлено.`; m.className = 'msg is-ok'; }
        } catch (e) {
          say(e.message, 'is-error'); save.disabled = false;
          if (e.taken) d.dispatchEvent(new Event('change'));
        }
      });

      $('#cancelBtn').addEventListener('click', async () => {
        if (!confirm('Отменить запись? Время освободится для других.')) return;
        $('#cancelBtn').disabled = true; say('Отменяю…');
        try { await call('POST', { action: 'cancel' }); done('✓', 'Запись отменена', 'Спасибо, что предупредили! Если захотите — запишитесь снова на сайте.'); }
        catch (e) { say(e.message, 'is-error'); $('#cancelBtn').disabled = false; }
      });
    }

    (async () => {
      if (!id || !t) return done('?', 'Ссылка неполная', 'Откройте ссылку из письма целиком.');
      try {
        const site = await (await fetch('../content/site.json', { cache: 'no-cache' })).json();
        if (Array.isArray(site.slots) && site.slots.length) slots = site.slots;
      } catch (e) {}
      try { render((await call('GET')).booking); }
      catch (e) { done('—', e.gone ? 'Запись не найдена' : 'Не получилось открыть', esc(e.message)); }
    })();
  })();
  </script>
</body>
</html>
